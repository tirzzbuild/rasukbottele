<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dark-Ai Messenger | CRPT.ZDX</title>
    <style>
        :root { --neon-green: #00ff41; --dark-bg: #0d0d0d; }
        body { background: var(--dark-bg); color: var(--neon-green); font-family: 'Consolas', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #auth-screen, #chat-screen { border: 1px solid var(--neon-green); padding: 25px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); width: 450px; }
        .hidden { display: none; }
        input { width: 100%; background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; margin: 10px 0; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 10px; background: var(--neon-green); color: #000; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        button:hover { background: #00cc33; }
        #chat-log { height: 300px; border: 1px solid #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column-reverse; font-size: 13px; }
        .msg { margin-bottom: 8px; padding: 5px; border-radius: 3px; }
        .msg.me { color: #00d4ff; border-left: 2px solid #00d4ff; }
        .msg.them { color: var(--neon-green); border-left: 2px solid var(--neon-green); }
        .header { text-align: center; font-size: 18px; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-green); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="header">[ ACCESS REQUIRED ]</div>
    <p style="font-size: 12px; text-align: center;">ENTER BOT TOKEN TO ESTABLISH CONNECTION</p>
    <input type="text" id="tokenInput" placeholder="8961748717:AAFvOr7DlE4K2qCx1xQws0KezMMhRPr-Y0o">
    <button onclick="initConnection()">Connect to Server</button>
</div>

<div id="chat-screen" class="hidden">
    <div class="header">[ SESSION ACTIVE ]</div>
    <div style="font-size: 10px; margin-bottom: 5px;">TARGET CHAT ID:</div>
    <input type="text" id="targetId" placeholder="8741802770">
    
    <div id="chat-log"></div>
    
    <input type="text" id="msgInput" placeholder="Type your message..." onkeypress="handleEnter(event)">
    <button onclick="sendMessage()">SEND DATA</button>
    <button onclick="location.reload()" style="background:transparent; color:red; border:1px solid red; margin-top:5px; height: 30px; font-size: 10px;">TERMINATE</button>
</div>

<script>
    let BOT_TOKEN = "";
    let lastUpdateId = 0;

    function initConnection() {
        BOT_TOKEN = document.getElementById('tokenInput').value;
        if (!BOT_TOKEN) return alert("TOKEN REQUIRED");
        
        // Simulasikan pengecekan token sederhana
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getMe`)
            .then(res => res.json())
            .then(data => {
                if(data.ok) {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('chat-screen').classList.remove('hidden');
                    startPolling();
                } else {
                    alert("INVALID TOKEN");
                }
            });
    }

    async function sendMessage() {
        const chatId = document.getElementById('targetId').value;
        const msg = document.getElementById('msgInput').value;
        if (!chatId || !msg) return;

        appendLog(`ME: ${msg}`, 'me');
        document.getElementById('msgInput').value = "";

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: chatId, text: msg })
        });
    }

    function startPolling() {
        setInterval(async () => {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`);
            const data = await res.json();
            if (data.ok && data.result.length > 0) {
                data.result.forEach(u => {
                    lastUpdateId = u.update_id;
                    if (u.message) {
                        appendLog(`${u.message.from.first_name}: ${u.message.text}`, 'them');
                    }
                });
            }
        }, 2000);
    }

    function appendLog(text, type) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
        log.prepend(div);
    }

    function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }
</script>

</body>
</html>
